name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build -t devops-project:latest .
    
    - name: Test container
      run: |
        docker run -d -p 80:80 --name test-app devops-project:latest
        sleep 5
        curl http://localhost:80
        docker stop test-app
    
    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    
    - name: Push to Docker Hub
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag devops-project:latest ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest
        docker tag devops-project:latest ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:${{ github.sha }}
    
    - name: Deploy to AWS EC2
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest
          docker stop devops-app || true
          docker rm devops-app || true
          docker run -d --name devops-app -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/devops-project:latest